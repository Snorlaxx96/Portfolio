name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SNORLAXX_PORTFOLIO }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Error: FIREBASE_SERVICE_ACCOUNT_SNORLAXX_PORTFOLIO secret is not set"
            exit 1
          fi
          KEY_FILE="$(mktemp)"
          printf '%s\n' "$FIREBASE_SERVICE_ACCOUNT" > "$KEY_FILE"
          export GOOGLE_APPLICATION_CREDENTIALS="$KEY_FILE"
          npx --yes firebase-tools deploy --only hosting --project snorlaxx-portfolio
          rm -f "$KEY_FILE"

