name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SNORLAXX_PORTFOLIO }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error title=Missing Secret::Secret FIREBASE_SERVICE_ACCOUNT_SNORLAXX_PORTFOLIO is empty or not configured in repository secrets."
            exit 1
          fi
          echo "Secret is present. Key length: ${#FIREBASE_SERVICE_ACCOUNT}"
          KEY_FILE="/tmp/service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$KEY_FILE"
          export GOOGLE_APPLICATION_CREDENTIALS="$KEY_FILE"
          npx --yes firebase-tools deploy --only hosting --project snorlaxx-portfolio --non-interactive
          rm -f "$KEY_FILE"

